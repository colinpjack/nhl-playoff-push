name: Update playoff dashboard

# A few slots per hour so a missed tick does not leave the board stale.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/fetch_playoff_data.py"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest NHL data
        run: python scripts/fetch_playoff_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data teams
          if git diff --staged --quiet; then
            echo "No standings or schedule changes."
          else
            git commit -m "chore: refresh NHL playoff dashboard"
            git pull --rebase origin HEAD
            git push
          fi
